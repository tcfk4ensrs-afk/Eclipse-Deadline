<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GCC Terminal - Briefing</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #050a05;
            --dim-green: rgba(0, 255, 65, 0.15);
            --warning-yellow: #ffff00;
        }

        body {
            background: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .intro-container {
            width: 900px;
            height: 550px;
            border: 1px solid var(--neon-green);
            background: rgba(0, 5, 0, 0.9);
            display: flex; /* 横並びにする */
            box-shadow: 0 0 30px var(--dim-green);
            position: relative;
        }

        /* 左側：立ち絵エリア */
        .char-stage {
            width: 350px;
            border-right: 1px solid var(--dim-green);
            display: flex;
            justify-content: center;
            align-items: flex-end; /* 足元を底に合わせる */
            background: rgba(0, 255, 65, 0.02);
            overflow: hidden;
        }

        #char-img {
            max-width: 100%;
            max-height: 90%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px var(--neon-green));
            transition: 0.5s; /* 切り替え時のフェード用 */
        }

        /* 右側：テキストエリア */
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .system-msg { font-size: 0.7em; color: var(--warning-yellow); margin-bottom: 10px; }
        #speaker-name { font-size: 1.4em; border-bottom: 2px solid var(--neon-green); margin-bottom: 15px; width: fit-content; }
        
        #dialogue-text {
            font-size: 1.1em;
            line-height: 1.6;
            flex-grow: 1;
        }

        .choice-container { display: flex; flex-direction: column; gap: 8px; margin-top: 20px;}

        .choice-btn {
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 12px;
            cursor: pointer;
            text-align: left;
            font-family: 'Courier New', monospace;
        }
        .choice-btn:hover { background: var(--neon-green); color: #000; }

        .static {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="intro-container">
        <div class="static"></div>
        
        <div class="char-stage">
            <img id="char-img" src="assets/placeholder.png" alt="Character Stand-in">
        </div>

        <div class="main-content">
            <div class="system-msg">>> CHANNEL OPEN: BRIEFING PHASE</div>
            <div id="speaker-name">SYSTEM</div>
            <div id="dialogue-text">Initializing communication...</div>

            <div class="choice-container" id="choice-area"></div>
        </div>
    </div>
    <script src="script_intro.js"></script>
</body>
</html>
