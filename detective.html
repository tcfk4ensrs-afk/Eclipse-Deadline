<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCC Terminal - Interrogation Phase</title>
    <link rel="stylesheet" href="style_detective.css">
    <style>
        /* --- 基本レスポンシブ設定 --- */
        body { margin: 0; padding: 0; overflow-x: hidden; }

        .game-container {
            display: grid;
            grid-template-columns: 320px 1fr; /* PC用：左にパネル、右にメイン */
            gap: 15px;
            width: 100vw;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }

        /* スマホ用レイアウト（画面幅が短い時） */
        @media (max-width: 850px) {
            .game-container {
                display: flex;
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .side-panel { order: 2; width: 100%; }
            .main-panel { order: 1; height: 70vh; min-height: 400px; }
        }

        /* --- API Config Area (Inline) --- */
        .api-config-area {
            border: 1px solid #00ff41;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 255, 65, 0.05);
        }

        .api-config-area h4 {
            margin: 0 0 10px 0;
            font-size: 0.7rem;
            color: #00ff41;
            letter-spacing: 1px;
        }

        .api-input-group {
            display: flex;
            gap: 10px;
        }

        .api-input-group input {
            flex-grow: 1;
            background: #000;
            color: #fff;
            border: 1px solid #00ff41;
            padding: 8px;
            font-family: monospace;
        }

        .api-input-group button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 0 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .api-status-msg {
            font-size: 0.65rem;
            margin-top: 8px;
            color: #ffff00;
        }

        /* --- 地図モーダル演出 --- */
        #map-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        #map-overlay img {
            max-width: 95%;
            max-height: 95%;
            border: 2px solid #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.5);
        }

        /* --- 地図パネルの装飾 --- */
        .map-panel {
            margin-top: 15px;
            border: 1px solid #00ff41;
            padding: 8px;
            background: rgba(0, 10, 0, 0.8);
        }

        .map-container img {
            width: 100%;
            cursor: zoom-in;
            filter: sepia(1) hue-rotate(90deg) brightness(0.8);
            transition: 0.3s;
        }

        .map-container img:hover { filter: none; }

        /* 告発ボタン */
        .danger-btn {
            background: #4a0000; color: #ff3333; border: 1px solid #ff3333;
            padding: 12px; width: 100%; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="map-overlay" onclick="closeMap()">
        <img id="enlarged-map" src="" alt="Enlarged Map">
    </div>

    <div class="game-container">
        <div class="panel side-panel">
            <h3>SECURED EVIDENCE</h3>
            <div id="evidence-list" style="flex-grow: 1; overflow-y: auto; max-height: 30vh;"></div>

            <div class="map-panel">
                <h4 style="font-size: 0.6rem; color: #00ff41; text-align: center; margin: 0 0 5px 0;">SCHEMATIC: MAP-01</h4>
                <div class="map-container">
                    <img src="assets/map1.jpg" alt="Ship Map 1" onclick="openMap(this.src)">
                </div>
            </div>
            
            <div class="status-box" style="margin-top: 15px;">
                <button id="accuse-btn" class="danger-btn" onclick="goToAccusation()">👉 真犯人を告発する</button>
            </div>
        </div>

        <div class="panel main-panel">
            <div id="main-menu">
                <div class="header">
                    <h2>INTERROGATION PROTOCOL</h2>
                    <p style="font-size: 0.8rem;">システム構成と容疑者の選択</p>
                </div>

                <div class="api-config-area">
                    <h4>[SYSTEM CONFIG: GEMINI API]</h4>
                    <div class="api-input-group">
                        <input type="password" id="api-key-input" placeholder="AIzaSy...">
                        <button onclick="saveApiKey()">SAVE</button>
                    </div>
                    <p id="api-status-msg" class="api-status-msg">>> APIキーが未検出です。AIプロトコルを有効化してください。</p>
                </div>

                <div id="character-list" class="char-grid"></div>
            </div>

            <div id="interrogation-room" style="display: none; height: 100%; flex-direction: column;">
                <div class="chat-header" style="display: flex; align-items: center; gap: 10px; padding-bottom: 10px;">
                    <button id="back-btn" style="background: none; color: #00ff41; border: 1px solid #00ff41;">⬅ 戻る</button>
                    <span id="target-name">TARGET</span>
                </div>
                <div id="chat-log" style="flex-grow: 1; overflow-y: auto; border: 1px solid #222; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.5);"></div>
                <div class="input-area" style="display: flex; gap: 5px;">
                    <input type="text" id="chat-input" placeholder="問い詰める内容を入力..." style="flex-grow: 1; background: #000; color: #fff; border: 1px solid #00ff41; padding: 10px;">
                    <button id="send-btn" style="background: #00ff41; color: #000; border: none; padding: 0 20px; font-weight: bold;">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🟢 画像拡大ロジック
        function openMap(src) {
            const overlay = document.getElementById('map-overlay');
            const img = document.getElementById('enlarged-map');
            img.src = src;
            overlay.style.display = 'flex';
        }

        function closeMap() {
            document.getElementById('map-overlay').style.display = 'none';
        }

        // 🟢 告発遷移
        function goToAccusation() {
            if (confirm("尋問を終了し、告発プロトコルへ移行しますか？\n（この操作は取り消せません）")) {
                document.body.style.opacity = "0";
                document.body.style.transition = "opacity 1s";
                setTimeout(() => { window.location.href = "accusation.html"; }, 1000);
            }
        }
    </script>

    <script type="module">
        import { sendToAI } from './ai.js';
        window.sendToAI = sendToAI;
    </script>
    <script src="script_detective.js"></script>
</body>
</html>
