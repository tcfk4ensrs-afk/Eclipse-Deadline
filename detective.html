<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCC Terminal - Interrogation Phase</title>
    <link rel="stylesheet" href="style_detective.css">
    <style>
        /* 告発ボタンを目立たせる追加スタイル */
        .danger-btn {
            background: #4a0000;
            color: #ff3333;
            border: 1px solid #ff3333;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        .danger-btn:hover {
            background: #ff3333;
            color: #000;
            box-shadow: 0 0 15px #ff3333;
        }

        /* 🟢 船内マップエリアの追加スタイル */
        .map-panel {
            margin-top: 20px;
            border: 1px solid #00ff41;
            background: rgba(0, 5, 0, 0.9);
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.2);
        }

        .map-panel h4 {
            font-size: 0.7rem;
            color: #00ff41;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            padding-bottom: 4px;
        }

        .map-container {
            width: 100%;
            overflow: hidden;
            border: 1px solid #333;
            cursor: zoom-in;
        }

        .map-container img {
            width: 100%;
            height: auto;
            display: block;
            /* 🟢 尋問フェーズは少し緊迫感を出すためセピア/グリーンのフィルターを適用 */
            filter: sepia(1) hue-rotate(90deg) brightness(0.8) contrast(1.2);
            transition: 0.3s;
        }

        .map-container img:hover {
            filter: none;
            brightness: 1.1;
        }
    </style>
</head>
<body>
    <div id="api-modal" class="modal">
        <div class="modal-content">
            <h3>SYSTEM: API KEY CONFIG</h3>
            <p>Gemini APIキーを入力してください（テスト用）</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <div class="modal-btns">
                <button onclick="saveApiKey()">SAVE & CONNECT</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="panel side-panel">
            <h3>SECURED EVIDENCE</h3>
            <div id="evidence-list"></div>

            <div class="map-panel">
                <h4>SHIP SCHEMATIC: MAP-01</h4>
                <div class="map-container">
                    <img src="assets/map1.jpg" alt="Ship Map 1" onclick="window.open(this.src)">
                </div>
            </div>
            
            <div class="status-box">
                <p>STATUS: ANALYZING</p>
                <button id="accuse-btn" class="danger-btn" onclick="goToAccusation()">👉 真犯人を告発する</button>
            </div>
        </div>

        <div class="panel main-panel">
            <div id="main-menu">
                <div class="header">
                    <h2>INTERROGATION PROTOCOL</h2>
                    <p>容疑者を選択して尋問を開始してください。</p>
                </div>
                <div id="character-list" class="char-grid"></div>
            </div>

            <div id="interrogation-room" style="display: none;">
                <div class="chat-header">
                    <button id="back-btn">⬅ 戻る</button>
                    <span id="target-name">TARGET NAME</span>
                </div>
                <div id="chat-log"></div>
                <div class="input-area">
                    <input type="text" id="chat-input" placeholder="問い詰める内容を入力...">
                    <button id="send-btn">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { sendToAI } from './ai.js';
        window.sendToAI = sendToAI;
    </script>
    <script src="script_detective.js"></script>

    <script>
        function goToAccusation() {
            // プレイヤーへの最終確認
            const msg = "【最終警告】\nこれより告発・隔離プロトコルに移行します。\n尋問フェーズには戻れません。よろしいですか？";
            if (confirm(msg)) {
                // 画面を暗くする演出などを挟んで遷移
                document.body.style.opacity = "0";
                document.body.style.transition = "opacity 1s";
                setTimeout(() => {
                    window.location.href = "accusation.html";
                }, 1000);
            }
        }
    </script>
</body>
</html>
