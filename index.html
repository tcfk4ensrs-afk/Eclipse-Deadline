    <div class="container">
        <h1>Mission: Deep Space</h1>
        
        <h2>【あらすじ】</h2>
        <p>西暦2045年。火星からの帰還途中、宇宙船「ゼノビア号」のメインエンジンが突如停止した。
           静まり返る船内。予備電源に切り替わった直後、通信室から悲鳴が上がる…。</p>

        <h2>【登場人物】</h2>
        <div class="character-card">
            <strong>● 船長：カイト</strong><br>
            常に沈着冷静。今回のミッションのリーダー。
        </div>
        <div class="character-card">
            <strong>● エンジニア：リン</strong><br>
            機械整備の天才。少し気が弱いが責任感は強い。
        </div>
        <div class="character-card">
            <strong>● 医務官：シロウ</strong><br>
            皮肉屋だが腕は一流。過去の経歴には謎が多い。
        </div>

        <a href="select.html" class="start-link">>> 第一フェーズ：船内探索を開始する</a>
