<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GCC Terminal - Investigation</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #050a05;
            --dim-green: rgba(0, 255, 65, 0.15);
            --warning-yellow: #ffff00;
        }

        body {
            background: var(--dark-bg);
            background-image: 
                linear-gradient(var(--dim-green) 1px, transparent 1px),
                linear-gradient(90deg, var(--dim-green) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 画面全体に薄く走査線を入れる */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            z-index: 10;
            background-size: 100% 4px;
            pointer-events: none;
        }

        .game-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            width: 95vw;
            height: 90vh;
        }

        .panel {
            border: 1px solid var(--neon-green);
            background: rgba(0, 5, 0, 0.9);
            backdrop-filter: blur(8px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 20px var(--dim-green);
        }

        h3 { border-bottom: 1px solid var(--neon-green); padding-bottom: 5px; margin-top: 0; font-size: 1em; }

        /* キャラクター選択ボタン */
        .char-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            cursor: pointer;
            text-align: left;
            transition: 0.3s;
        }

        .char-btn:hover:not(:disabled) { background: var(--dim-green); box-shadow: 0 0 10px var(--neon-green); }
        .char-btn.active { background: var(--neon-green); color: #000; font-weight: bold; }
        
        /* 休息中（連続使用不可）のスタイル */
        .char-btn:disabled {
            border-color: #333;
            color: #444;
            cursor: not-allowed;
            position: relative;
        }
        .char-btn:disabled::after { content: " [RECHARGING]"; font-size: 0.7em; float: right; }

        /* 探索場所ボタン */
        .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .loc-btn {
            padding: 15px;
            background: rgba(0, 255, 65, 0.05);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            cursor: pointer;
            font-size: 0.9em;
        }
        .loc-btn:hover:not(:disabled) { background: var(--neon-green); color: #000; }
        .loc-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ログウィンドウ */
        #log-window {
            flex-grow: 1;
            border: 1px inset var(--neon-green);
            background: #000;
            margin-top: 15px;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.85em;
            line-height: 1.5;
        }

        .analyzing { animation: blink 1s infinite; color: var(--warning-yellow); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* インベントリ */
        .evidence-item {
            margin-bottom: 15px;
            border-left: 2px solid var(--warning-yellow);
            padding-left: 10px;
        }
        .evidence-item strong { color: var(--warning-yellow); font-size: 0.9em; }
        .evidence-item p { margin: 3px 0; font-size: 0.75em; color: #ccc; }

        .turn-display {
            font-size: 1.2em;
            color: var(--warning-yellow);
            text-align: center;
            padding: 5px;
            border: 1px double var(--warning-yellow);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="panel">
            <h3>PERSONNEL STATUS</h3>
            <div id="char-list">
                <button class="char-btn" id="btn-engineer" onclick="selectChar('engineer')">ENG: ノア</button>
                <button class="char-btn" id="btn-captain" onclick="selectChar('captain')">CPT: ハリス</button>
                <button class="char-btn" id="btn-pilot" onclick="selectChar('pilot')">PLT: リク</button>
                <button class="char-btn" id="btn-observer" onclick="selectChar('observer')">OBS: メイ</button>
            </div>
            <p style="font-size:0.7em; margin-top:auto; opacity:0.5;">※各員、連続派遣には休息が必要です。</p>
        </div>

        <div class="panel">
            <div class="turn-display">MISSION PROGRESS: TURN <span id="turn-count">1</span> / 5</div>
            <h3>SECTOR SCANNER</h3>
            <div class="location-grid">
                <button class="loc-btn" onclick="executeInvestigate('脱出ポッド')">脱出ポッド</button>
                <button class="loc-btn" onclick="executeInvestigate('操縦室')">操縦室</button>
                <button class="loc-btn" onclick="executeInvestigate('倉庫')">倉庫</button>
                <button class="loc-btn" onclick="executeInvestigate('寝室')">寝室</button>
                <button class="loc-btn" onclick="executeInvestigate('トイレ')">トイレ</button>
            </div>
            <div id="log-window">>> 管制システム オンライン。派遣する要員を選択してください。</div>
        </div>

        <div class="panel">
            <h3>SECURED EVIDENCE</h3>
            <div id="evidence-list">
                <p style="color:#444; font-size:0.8em;">取得済みデータなし</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
